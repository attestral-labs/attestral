apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-gateway
  namespace: agents
spec:
  replicas: 2
  selector:
    matchLabels: { app: llm-gateway }
  template:
    metadata:
      labels: { app: llm-gateway }
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:main-latest
          ports:
            - containerPort: 4000
          env:
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: openai } }
            - name: ANTHROPIC_API_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: anthropic } }
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: gemini } }
            - name: GROQ_API_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: groq } }
            - name: MISTRAL_API_KEY
              valueFrom: { secretKeyRef: { name: llm-keys, key: mistral } }
        - name: notes-sidecar
          image: ghcr.io/example/notes:1.0.0
          env:
            - name: NOTION_API_KEY
              valueFrom: { secretKeyRef: { name: notes-key, key: notion } }
