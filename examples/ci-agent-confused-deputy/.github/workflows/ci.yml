# Benign counterpart: a maintainer-triggered build with a read-only token,
# no repository secrets, and no AI agent. All four derived signals are false.
name: CI
on: push

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: pytest -q
